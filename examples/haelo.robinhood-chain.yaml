# Robinhood Chain (Uniswap v3, chain 4663). Read docs/CHAIN.md.
# Quotes need no key. A live swap also needs live.enabled, confirm: true, and HAELO_PRIVATE_KEY.
version: 1
stateDir: ~/.haelo-chain

broker:
  type: robinhood-chain
  network: mainnet

agent: {}

live:
  enabled: false

rails:
  maxOrderUsd: 500
  maxDailyUsd: 2000
  maxSlippageBps: 100
  allowAssetClasses: [crypto]
