      content="Haelo is an MCP gateway that puts AI trading agents on an autonomy ladder: shadow, paper, propose, micro, standard. Policy rails, automatic demotion, and a hash-chained audit log."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Haelo" />
    <meta property="og:title" content="Haelo: an autonomy ladder for AI trading agents" />

      property="og:description"
      content="The agent starts in shadow. It earns the next rung only by keeping rules you wrote down first. Break one, and Haelo demotes it."
    />

      content="Shadow, then paper, then a human, then a tiny live cap. An MCP gateway that does not trust the agent."

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%haelo-icon.png" />
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
