name: website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run typecheck
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Default base is the domain root
        working-directory: website
        run: |
          grep -q 'src="/assets/' dist/index.html
          ! grep -q '/Haelo/' dist/index.html
          grep -q 'pathSegmentsToKeep = 0' dist/404.html
      - run: npm run build
        working-directory: website
        env:
          VERCEL: "1"
      - name: Vercel base is the domain root
        working-directory: website
        run: |
          grep -q 'src="/assets/' dist/index.html
          ! grep -q '/Haelo/' dist/index.html
          grep -q 'pathSegmentsToKeep = 0' dist/404.html
